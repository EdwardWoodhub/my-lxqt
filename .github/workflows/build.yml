name: Build LXQt OS Based On Fedora 44 Bootc Image
on:
  schedule:
    - cron: "27 20 * * *"
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: my-lxqt-vm
  GHCR_REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 释放磁盘空间
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      # 登录 GitHub Packages (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 不使用 buildx，直接使用原生 docker build 并指定 -f ./Containerfile
      - name: Build and Push Docker Image
        run: |
          # 强制将用户名转为小写，避免 "repository name must be lowercase"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ env.GHCR_REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:latest"
          
          echo "Building image: $IMAGE_TAG using ./Containerfile"
          docker build -t "$IMAGE_TAG" -f ./Containerfile .
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Pushing image to GHCR..."
            docker push "$IMAGE_TAG"
          fi

      # 构建 Live/安装 ISO (使用 bootc-image-builder)
      - name: Build Bootc Live ISO
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          mkdir -p output
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="${{ env.GHCR_REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:latest"

          # 1. 登录 podman 并将刚刚推送到 GHCR 的镜像拉取到本地 containers/storage
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.GHCR_REGISTRY }} -u ${{ github.actor }} --password-stdin
          sudo podman pull "$IMAGE_TAG"

          # 2. 运行 bootc-image-builder（移除了废弃的 --local 参数）
          sudo podman run --rm -i --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            "$IMAGE_TAG"

          # 3. 移动生成的 ISO
          sudo mv output/bootiso/install.iso ./${{ env.IMAGE_NAME }}.iso
      
      

      # 将大于 2GB 的 ISO 切割为分卷（避免超出上传限制）
      - name: Split ISO
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          split -b 1500M ${{ env.IMAGE_NAME }}.iso ${{ env.IMAGE_NAME }}.iso.part-
          ls -lh ${{ env.IMAGE_NAME }}.iso.part-*

      # 发布 ISO 分卷至 GitHub Releases
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          tag_name: "release-${{ github.run_number }}"
          name: "LiveISO Release - Run ${{ github.run_number }}"
          files: ${{ env.IMAGE_NAME }}.iso.part-*
          generate_release_notes: true
      
      # 登录阿里云 ACR
      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 使用 Skopeo 同步镜像至阿里云 ACR
      - name: Sync OCI Image from GHCR to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          skopeo copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.GHCR_REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${OWNER_LOWER}/${{ env.IMAGE_NAME }}:latest
