name: bluebuild
on:
  schedule:
    - cron:
        "27 20 * * *" # 每天 CST 04:27 构建
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # 签名与分发镜像所需的权限
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          # 1. 私钥内容
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          # 2. 补上这一行：私钥的解密密码
          # cosign_password: ${{ secrets.COSIGN_PASSWORD }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # 建议开启，因为安装了 v2rayA 和多个平铺桌面组件，镜像体积不会太小
          maximize_build_space: true

# =========================================================================
      # 【新增步骤 1】：登录阿里云 ACR（仅在主分支 push 或手动触发时执行，避免 PR 浪费）
      # =========================================================================
      - name: Log in to Aliyun ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # =========================================================================
      # 【新增步骤 2】：使用 Skopeo 零开销将镜像从 GHCR 直接同步到阿里云 ACR
      # =========================================================================
      - name: Sync OCI Image from GHCR to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Syncing latest image layers to Aliyun ACR in compatibility mode..."
          skopeo copy \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://ghcr.io/edwardwoodhub/my-lxqt-vm:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-lxqt-vm:latest
